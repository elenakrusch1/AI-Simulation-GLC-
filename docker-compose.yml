name: datacenter-deal-simulation

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dcsim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dcsim_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-dcsim}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dcsim} -d $${POSTGRES_DB:-dcsim}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-dcsim}:${POSTGRES_PASSWORD:-dcsim_dev_password}@db:5432/${POSTGRES_DB:-dcsim}?schema=public
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dcsim_session}
      # Optional — set both in .env to get an admin account created
      # automatically on every boot (see docker-entrypoint.sh and the
      # "Creating the first administrator" section of the README).
      # Left unset here (rather than defaulted), so an empty/unset
      # .env value correctly disables auto-creation instead of passing
      # empty strings through.
      ADMIN_LOGIN_IDENTIFIER: ${ADMIN_LOGIN_IDENTIFIER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db-data:
